# Noctalia 5.1: DMS's layout and theme, using native widgets and services.
# Every root-level TOML file is loaded; this is the curated configuration layer.

[bar.default]
enabled = false
position = "top"
background_opacity = 0.5
radius = 0
concave_edge_corners = false
margin_edge = 4
margin_ends = 4
padding = 4
widget_spacing = 0
shadow = false
auto_hide = false
reserve_space = true
capsule = true
capsule_fill = "hover"
capsule_padding = 8
capsule_opacity = 1.0
start = [ "session", "launcher", "cpu", "ram", "group:network" ]
center = [ "taskbar" ]
end = [ "tray", "weather", "notifications", "group:controls", "clock" ]

[bar.default.monitor.DP-1]
enabled = true

[bar.default.monitor.DP-2]
enabled = true

[bar.default.monitor.DP-3]
enabled = true
start = [ "cpu", "ram", "gpu" ]
center = [ "media", "taskbar" ]
end = [ "volume", "notifications", "clock" ]

[[bar.default.capsule_group]]
id = "network"
members = [ "network_rx", "network_tx" ]
fill = "hover"
padding = 8
widget_spacing = 4

[[bar.default.capsule_group]]
id = "controls"
members = [ "microphone", "control-center" ]
fill = "hover"
padding = 8
widget_spacing = 4

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"
label_min_width = 32

[widget.ram]
type = "sysmon"
stat = "ram_pct"
visualization = "none"
label_min_width = 32

[widget.gpu]
type = "sysmon"
stat = "gpu_usage"
visualization = "none"
label_min_width = 32

[widget.network_rx]
type = "sysmon"
stat = "net_rx"
visualization = "none"
network_speed_compact = true

[widget.network_tx]
type = "sysmon"
stat = "net_tx"
visualization = "none"
network_speed_compact = true

[widget.launcher]
custom_image = "/run/current-system/sw/share/icons/hicolor/scalable/apps/nix-snowflake.svg"

# The workspaces widget cannot show every app icon; grouped taskbar can.
[widget.taskbar]
group_by_workspace = true
show_workspace_label = true
workspace_label_placement = "inside"
hide_empty_workspaces = true
group_single_icon_per_app = false
only_active_workspace = false
show_all_outputs = false
occupied_color = "surface_variant"

[widget.taskbar.actions]
scroll_up = "workspace-switch prev"
scroll_down = "workspace-switch next"

[widget.microphone]
type = "volume"
device = "input"
show_label = true
hide_when_inactive = false

# Left-click opens the native Audio tab, including per-application streams.
[widget.volume]
device = "output"
show_label = true

[widget.clock]
format = "{:%H:%M}"

[widget.media]
hide_when_no_media = true

[widget.tray]
color = "on_surface"

[shell]
avatar_path = "/home/nomig/.face"
time_format = "{:%H:%M}"
settings_show_advanced = true
setup_wizard_enabled = false
show_location = false
launch_apps_as_systemd_services = true
clipboard_enabled = true
clipboard_auto_paste = "ctrl_v"

[shell.panel]
transparency_mode = "soft"
open_near_click_control_center = false
session_placement = "floating"
session_position = "center"

[shell.launcher]
categories = false
app_grid = false

[shell.launcher.providers.calculator]
global = true

# Match DMS's action order; keep the familiar numeric shortcuts.
[[shell.session.actions]]
action = "reboot"
shortcut = "4"

[[shell.session.actions]]
action = "shutdown"
shortcut = "5"
variant = "destructive"

[[shell.session.actions]]
action = "lock"
shortcut = "1"

[[shell.session.actions]]
action = "suspend"
shortcut = "3"

[[shell.session.actions]]
action = "logout"
shortcut = "2"

[control_center]
shortcuts = []

[system.monitor]
enabled = true

[calendar]
enabled = true
event_time_format = "%H:%M"

[location]
address = "Lisbon, Portugal"

[weather]
enabled = true
unit = "celsius"

[dock]
enabled = false

[notification]
enable_daemon = true
monitors = [ "DP-3" ]
background_opacity = 0.93

[osd]
monitors = [ "DP-3" ]
position = "top_center"

[osd.kinds]
volume = false
media = false
brightness = false
power_profile = true

[lockscreen]
monitors = [ "DP-2" ]
lock_before_suspend = true

[lockscreen_widgets]
enabled = false

[wallpaper]
directory = "/home/nomig/Pictures/Wallpapers"
per_monitor_directories = true
transition = [ "fade" ]
transition_on_startup = true

[wallpaper.default]
path = "/home/nomig/Pictures/Wallpapers/Green Forest.jpg"

[wallpaper.monitor.DP-3]
directory = "/home/nomig/Pictures/Wallpapers/vertical"
